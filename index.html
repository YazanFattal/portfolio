<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Explore Yazan Fattal’s design, games, and web projects in an interactive retro desktop portfolio.">
<title>Yazan Fattal | Portfolio Desktop</title>
<link rel="icon" href="assets/favicon.png">
<link rel="stylesheet" href="desktop.css">
<script src="projects.js" defer></script>
<script src="desktop.js" defer></script>
</head>
<body>
<main id="workspace" aria-label="Portfolio desktop">
  <div class="desktop-mark" aria-hidden="true">YF<span>PORTFOLIO DESKTOP</span></div>
  <nav id="shortcuts" aria-label="Desktop shortcuts"></nav>
  <div id="windows"></div>
</main>
<aside id="start-menu" aria-label="Start menu" hidden>
  <header><img src="assets/me.JPG" alt=""><strong>Yazan Fattal</strong></header>
  <div class="start-links">
    <div><button data-open="projects" class="start-primary"><span data-icon="folder"></span><span><b>My Projects</b><small>Browse the complete portfolio</small></span></button>
    <button data-open="welcome"><span data-icon="computer"></span><span><b>Welcome</b><small>Go back to the desktop guide</small></span></button></div>
    <div><button data-open="about"><span data-icon="person"></span>About me</button>
    <button data-open="contact"><span data-icon="mail"></span>Contact</button>
    <a href="https://github.com/YazanFattal" target="_blank" rel="noopener noreferrer"><span data-icon="web"></span>GitHub ↗</a></div>
  </div>
  <footer><button id="hide-windows"><span aria-hidden="true">▣</span> Show desktop</button></footer>
</aside>
<footer id="taskbar">
  <button id="start" aria-expanded="false" aria-controls="start-menu" title="Open Start menu"><span class="flag" aria-hidden="true"><i></i><i></i><i></i><i></i></span>start</button>
  <div id="tasks" aria-label="Open windows"></div>
  <button id="desktop-toggle" aria-label="Show desktop" title="Show desktop">▣</button>
  <div class="tray"><span aria-hidden="true" class="tray-light">◆</span><time id="clock"></time></div>
</footer>
<noscript><p class="noscript">Enable JavaScript to explore this interactive portfolio.</p></noscript>
</body>
</html>

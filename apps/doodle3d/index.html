<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Doodle3D</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✏️</text></svg>">
<style>
:root{--bg:#f4f1fa;--panel:#fff;--ink:#241b3a;--mute:#7a6f94;--accent:#7c4dff;--line:#ddd5ee;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15101f;--panel:#211a33;--ink:#f1ecfb;--mute:#9d92b8;--accent:#9b7bff;--line:#352b4d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15101f;--panel:#211a33;--ink:#f1ecfb;--mute:#9d92b8;--accent:#9b7bff;--line:#352b4d;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;overscroll-behavior:none}
#app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
header{padding:12px 16px 8px;display:flex;justify-content:space-between;align-items:center}
#prompt{font-size:1.15rem;font-weight:700}
#prompt small{display:block;font-size:.75rem;font-weight:500;color:var(--mute)}
#count{background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:6px 12px;font-size:.85rem}
#stage{position:relative;flex:1;margin:0 12px;border-radius:20px;overflow:hidden;background:var(--panel);border:1px solid var(--line);min-height:0}
#stage,#stage *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-user-drag:none}
#stage{touch-action:none}#hint,#toast{pointer-events:none}
body.busy,body.busy *{-webkit-user-select:none;user-select:none}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block;outline:none}
#hint{position:absolute;inset:auto 0 14px;text-align:center;color:var(--mute);font-size:.85rem;pointer-events:none}
#toast{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:99px;font-size:.85rem;opacity:0;transition:opacity .2s;pointer-events:none}
#bar{padding:12px 16px 14px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px;align-items:center;justify-content:center}
button{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:14px;min-height:48px;padding:0 18px;flex:1}
button.main{background:var(--accent);color:#fff;border-color:transparent;flex:2}
button:active{transform:scale(.97)}
.sw{flex:none;width:40px;min-height:40px;height:40px;padding:0;border-radius:50%;border:3px solid var(--panel);box-shadow:0 0 0 1px var(--line)}
.sw.on{box-shadow:0 0 0 3px var(--accent)}
#view{display:none}
.srow{display:flex;align-items:center;gap:10px;font-size:.85rem;color:var(--mute)}
.srow span{width:72px}.srow input{flex:1;accent-color:var(--accent)}
body.v #view{display:flex}body.v #drawbar{display:none}
</style>
</head>
<body>
<div id="app">
<header><div id="prompt"></div><div id="count">Made: 0</div></header>
<div id="stage"><canvas id="gl"></canvas><canvas id="draw"></canvas><div id="hint">Draw with your finger, as many strokes as you like</div><div id="toast"></div></div>
<div id="bar">
<div id="drawbar"><div class="row" id="sws" style="margin-bottom:10px"></div>
<div class="row"><button id="clear">Clear</button><button id="redrawNow">Redraw</button><button id="make" class="main">Make it 3D ✨</button></div></div>
<div id="view"><div style="display:flex;flex-direction:column;gap:10px;width:100%">
<div class="srow"><span>Thickness</span><input type="range" id="wid" min="0" max="1" step="0.005" value="0.3" aria-label="Stroke thickness"></div>
<div class="srow"><span>Depth</span><input type="range" id="depth" min="0" max="1" step="0.01" value="0.4" aria-label="3D depth"></div>
<div class="row"><button id="redraw">Redraw</button><button id="next" class="main">Next prompt →</button></div></div></div>
</div>
</div>
<script src="three.min.js"></script>
<script>
const $=s=>document.querySelector(s);
const stage=$('#stage'),dc=$('#draw'),dx=dc.getContext('2d');
const COLORS=['#ff5fa2','#ffb02e','#2ecc9a','#3ea6ff','#9b6bff'];
const PROMPTS=['a star','a heart','a fish','a house','a cloud','a lightning bolt','a leaf','a crown','a spiral','a snake','a flower','a rocket'];
let wT=.3,dT=.4,built=null,hasModel=false,erasing=false,ring=null,strokes=[],parts=[],pts=[],drawing=false,color=COLORS[0],depth=1.2,made=0,norm=[],closed=false,mode='draw',pi=0;

// three.js setup
const renderer=new THREE.WebGLRenderer({canvas:$('#gl'),antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(40,1,.1,100);camera.position.set(0,0.5,11);
scene.add(new THREE.HemisphereLight(0xffffff,0x6655aa,.9));
const sun=new THREE.DirectionalLight(0xffffff,.9);sun.position.set(4,6,8);scene.add(sun);
const group=new THREE.Group();scene.add(group);
let vx=0,dragging=false,lx=0,ly=0;

function size(){
  const r=stage.getBoundingClientRect(),d=devicePixelRatio||1;
  dc.width=r.width*d;dc.height=r.height*d;dx.setTransform(d,0,0,d,0,0);
  renderer.setSize(r.width,r.height,false);camera.aspect=r.width/r.height;camera.updateProjectionMatrix();paint();
}
function paint(){
  const r=stage.getBoundingClientRect();dx.clearRect(0,0,r.width,r.height);
  dx.lineWidth=7;dx.lineCap=dx.lineJoin='round';
  [...strokes,{p:pts,c:color}].forEach(s=>{if(s.p.length===1){dx.fillStyle=s.c;dx.beginPath();dx.arc(s.p[0].x,s.p[0].y,3.5,0,7);dx.fill();return}if(s.p.length<2)return;dx.strokeStyle=s.c;dx.beginPath();dx.moveTo(s.p[0].x,s.p[0].y);s.p.forEach(q=>dx.lineTo(q.x,q.y));dx.stroke()});
  if(ring){dx.strokeStyle='#999';dx.lineWidth=1.5;dx.beginPath();dx.arc(ring.x,ring.y,22,0,7);dx.stroke()}
}
function pos(e){const r=dc.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
let pid=null;
const noSel=()=>{const g=window.getSelection&&getSelection();if(g&&g.removeAllRanges)g.removeAllRanges()};
// block selection, native drag and the long-press menu, only inside the drawing area
['contextmenu','dragstart','selectstart'].forEach(t=>stage.addEventListener(t,e=>e.preventDefault()));
// touch fallback (non-passive so preventDefault works on iOS)
['touchstart','touchmove'].forEach(t=>dc.addEventListener(t,e=>e.preventDefault(),{passive:false}));
dc.addEventListener('pointerdown',e=>{
  if(pid!==null)return; // one finger at a time
  e.preventDefault();noSel();pid=e.pointerId;document.body.classList.add('busy');
  try{dc.setPointerCapture(pid)}catch(_){}
  if(mode==='view'){dragging=true;lx=e.clientX;ly=e.clientY;return}
  $('#hint').style.display='none';
  if(erasing){drawing='e';wipeAt(pos(e));return}
  drawing=true;pts=[pos(e)];paint();
});
dc.addEventListener('pointermove',e=>{
  if(e.pointerId!==pid)return;
  if(drawing==='e'){wipeAt(pos(e))}
  else if(drawing){const p=pos(e),l=pts[pts.length-1];if(Math.hypot(p.x-l.x,p.y-l.y)>3){pts.push(p);paint()}}
  else if(dragging){const dX=e.clientX-lx,dY=e.clientY-ly;lx=e.clientX;ly=e.clientY;vx=dX*.01;group.rotation.y+=dX*.01;group.rotation.x=Math.max(-1.2,Math.min(1.2,group.rotation.x+dY*.01))}
});
const up=e=>{
  if(e&&e.pointerId!==pid)return;
  if(drawing===true){if(pts.length)strokes.push({p:densify(pts),c:color});pts=[]}
  drawing=false;dragging=false;ring=null;pid=null;document.body.classList.remove('busy');noSel();paint();
};
['pointerup','pointercancel','lostpointercapture'].forEach(t=>dc.addEventListener(t,up));
addEventListener('blur',()=>up());

function toast(t){const el=$('#toast');el.textContent=t;el.style.opacity=1;setTimeout(()=>el.style.opacity=0,1600)}

function smooth(P){let a=P;for(let r=0;r<2&&a.length>2;r++){const b=a;a=b.map((p,i)=>i&&i<b.length-1?new THREE.Vector2((b[i-1].x+p.x+b[i+1].x)/3,(b[i-1].y+p.y+b[i+1].y)/3):p)}return a}
function prepare(){
  const all=strokes.filter(t=>t.p.length);
  const xs=all.flatMap(t=>t.p.map(p=>p.x)),ys=all.flatMap(t=>t.p.map(p=>p.y));
  const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
  const k=4/Math.max(x1-x0,y1-y0,40),cx=(x0+x1)/2,cy=(y0+y1)/2;
  // every stroke stays its own open polyline: nothing is closed or filled
  built={k,ref:Math.min(stage.clientWidth,stage.clientHeight),str:all.map(t=>({c:t.c,pts:smooth(t.p.map(p=>new THREE.Vector2((p.x-cx)*k,-(p.y-cy)*k)))}))};
}
function build(){
  while(group.children.length){const c=group.children.pop();c.geometry&&c.geometry.dispose();c.material&&c.material.dispose()}
  if(!built)return;
  // width and depth are separate, both scale with the stage size so they look the same on any screen
  const w=(.006+.08*wT*wT)*built.ref*built.k,d=(.004+.12*dT*dT)*built.ref*built.k;
  const by={};built.str.forEach(t=>{(by[t.c]=by[t.c]||[]).push(t.pts)});
  const m=new THREE.Matrix4(),q=new THREE.Quaternion(),sc=new THREE.Vector3(),ps=new THREE.Vector3(),z=new THREE.Vector3(0,0,1);
  for(const c in by){
    let nd=0;by[c].forEach(P=>nd+=P.length);
    const mat=new THREE.MeshStandardMaterial({color:c,roughness:.35,metalness:.1});
    const cg=new THREE.CylinderGeometry(.5,.5,1,16);cg.rotateX(Math.PI/2);
    const disc=new THREE.InstancedMesh(cg,mat,nd),box=new THREE.InstancedMesh(new THREE.BoxGeometry(1,1,1),mat,nd);
    let i=0,j=0;
    by[c].forEach(P=>P.forEach((p,n)=>{
      q.identity();ps.set(p.x,p.y,0);sc.set(w,w,d);m.compose(ps,q,sc);disc.setMatrixAt(i++,m);
      if(n){const a=P[n-1],ex=p.x-a.x,ey=p.y-a.y;q.setFromAxisAngle(z,Math.atan2(ey,ex));ps.set((p.x+a.x)/2,(p.y+a.y)/2,0);sc.set(Math.hypot(ex,ey),w,d);m.compose(ps,q,sc);box.setMatrixAt(j++,m)}
    }));
    disc.count=i;box.count=j;disc.frustumCulled=box.frustumCulled=false;
    group.add(disc);if(j)group.add(box);
  }
}
function ghost(on){group.children.forEach(c=>{c.material.transparent=on;c.material.opacity=on?.3:1;c.material.needsUpdate=true})}
function densify(a){const o=[a[0]];for(let i=1;i<a.length;i++){const p=a[i-1],q=a[i],n=Math.ceil(Math.hypot(q.x-p.x,q.y-p.y)/4);for(let k=1;k<=n;k++)o.push({x:p.x+(q.x-p.x)*k/n,y:p.y+(q.y-p.y)*k/n})}return o}
function wipeAt(p){let hit=false;const out=[];
  strokes.forEach(s=>{let run=[];s.p.forEach(q=>{if(Math.hypot(q.x-p.x,q.y-p.y)<22){hit=true;if(run.length>1||(run.length===1&&s.p.length===1))out.push({p:run,c:s.c});run=[]}else run.push(q)});if(run.length>1||(run.length===1&&s.p.length===1))out.push({p:run,c:s.c})});
  if(hit)strokes=out;ring=p;paint()}
function wipe(){pts=[];strokes=[];paint();while(group.children.length){const c=group.children.pop();c.geometry&&c.geometry.dispose()}hasModel=false}
function setMode(m){mode=m;document.body.classList.toggle('v',m==='view');ghost(m==='draw');
  if(m==='view'){group.rotation.set(-.35,0,0);vx=.012}
  else{const h=$('#hint');h.textContent=hasModel?'Draw over the faded model, or tap Clear to start fresh':'Draw with your finger, as many strokes as you like';h.style.display=''}}
function newPrompt(){pi=(pi+1+Math.floor(Math.random()*3))%PROMPTS.length;showPrompt()}
function showPrompt(){$('#prompt').innerHTML='Draw '+PROMPTS[pi]+'<small>or anything you like</small>'}

$('#make').onclick=()=>{
  if(!strokes.length){toast('Draw a bigger shape first');return}
  prepare();build();hasModel=true;made++;$('#count').textContent='Made: '+made;
  pts=[];strokes=[];paint();setMode('view');
};
$('#clear').onclick=()=>{wipe();setMode('draw')};
$('#redrawNow').onclick=()=>{strokes.pop();pts=[];paint()};
$('#redraw').onclick=()=>{pts=[];paint();setMode('draw')};
$('#next').onclick=()=>{newPrompt();wipe();setMode('draw')};
$('#wid').oninput=e=>{wT=+e.target.value;if(hasModel)build()};
$('#depth').oninput=e=>{dT=+e.target.value;if(hasModel)build()};
const sw=$('#sws');
COLORS.forEach((c,i)=>{const b=document.createElement('button');b.className='sw'+(i?'':' on');b.style.background=c;b.setAttribute('aria-label','Colour '+(i+1));
  b.onclick=()=>{erasing=false;color=c;sw.querySelectorAll('.sw').forEach(x=>x.classList.remove('on'));b.classList.add('on');paint()};sw.appendChild(b)});
const er=document.createElement('button');er.className='sw';er.textContent='🧽';er.style.cssText='background:var(--panel);font-size:18px';er.setAttribute('aria-label','Eraser');
er.onclick=()=>{erasing=!erasing;sw.querySelectorAll('.sw').forEach(x=>x.classList.remove('on'));if(erasing){er.classList.add('on');toast('Eraser on: drag over a stroke')}else{sw.querySelector('.sw').classList.add('on');color=COLORS[0]}};
sw.appendChild(er);

(function loop(){
  requestAnimationFrame(loop);
  if(mode==='view'){if(!dragging){group.rotation.y+=vx;vx+=(.012-vx)*.03}}
  renderer.render(scene,camera);
})();
// in view mode, hide the 2D layer's drawing but keep it for drag input
addEventListener('resize',size);
showPrompt();setMode('draw');size();
</script>
</body>
</html>

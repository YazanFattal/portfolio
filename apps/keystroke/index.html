<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Keystroke – Typing Game</title>
<style>
:root{--bg:#f3f1ec;--panel:#fffdf8;--ink:#1d2433;--mute:#7a8191;--line:#d9d5ca;--ok:#1f7a54;--bad:#c23b3b;--acc:#2a4bd7;--accsoft:#dfe5ff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151d;--panel:#1b1f2b;--ink:#e8eaf2;--mute:#8a91a5;--line:#2c3243;--ok:#5fd09b;--bad:#ff7b7b;--acc:#8ea2ff;--accsoft:#252d52}}
:root[data-theme="dark"]{--bg:#12151d;--panel:#1b1f2b;--ink:#e8eaf2;--mute:#8a91a5;--line:#2c3243;--ok:#5fd09b;--bad:#ff7b7b;--acc:#8ea2ff;--accsoft:#252d52}
*{box-sizing:border-box}
html{color-scheme:light dark}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS",Verdana,system-ui,sans-serif;min-height:100vh;display:flex;justify-content:center;padding:20px}
main{width:100%;max-width:760px;display:flex;flex-direction:column;gap:20px;justify-content:center}
h1{font-size:clamp(34px,7vw,56px);margin:0;letter-spacing:-.03em;line-height:1}
p.sub{margin:8px 0 0;color:var(--mute);font-size:17px}
.hidden{display:none!important}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:520px){.choices{grid-template-columns:1fr}}
.choice{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:26px 18px;font:inherit;color:inherit;cursor:pointer;text-align:left;transition:border-color .15s,transform .1s}
.choice:hover,.choice:focus-visible{border-color:var(--acc);outline:none}
.choice:active{transform:scale(.98)}
.choice b{display:block;font-size:22px;margin:10px 0 4px}
.choice span{color:var(--mute);font-size:15px}
.choice svg{width:56px;height:40px;stroke:var(--acc);fill:none;stroke-width:2}
.stats{display:flex;gap:10px}
.stat{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.stat small{display:block;color:var(--mute);font-size:13px}
.stat strong{font-size:28px;font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:var(--acc);transition:width .25s linear}
#box{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:18px 20px;font:22px/1.7 "Courier New",ui-monospace,monospace;height:9.2em;overflow:hidden;position:relative;cursor:text;word-break:break-word}
#box.focus{border-color:var(--acc)}
#text{position:relative}
#text span{border-radius:3px}
.ok{color:var(--ok)}
.bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 18%,transparent)}
.cur{background:var(--accsoft);box-shadow:-2px 0 0 var(--acc)}
#hint{color:var(--acc);font-weight:bold;text-align:center;min-height:1.4em}
#kb{position:fixed;opacity:0;pointer-events:none;left:0;top:0;width:1px;height:1px}
.row{display:flex;gap:10px;flex-wrap:wrap}
button.btn{font:inherit;font-weight:bold;padding:12px 20px;border-radius:10px;border:2px solid var(--acc);background:var(--acc);color:var(--bg);cursor:pointer}
button.btn.alt{background:transparent;color:var(--acc)}
button.btn:focus-visible{outline:3px solid var(--accsoft)}
.result{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:22px}
.result .big{font-size:clamp(48px,12vw,84px);font-weight:bold;letter-spacing:-.03em;line-height:1}
.result p{color:var(--mute);margin:6px 0 16px}
</style>
</head>
<body>
<main>
  <header>
    <h1>Keystroke</h1>
    <p class="sub" id="sub">Pick your device, then start typing.</p>
  </header>

  <section id="pick">
    <div class="choices">
      <button class="choice" data-p="laptop">
        <svg viewBox="0 0 56 40"><rect x="9" y="4" width="38" height="24" rx="2"/><path d="M3 34h50l-4-6H7z"/></svg>
        <b>Laptop</b><span>Physical keyboard</span>
      </button>
      <button class="choice" data-p="phone">
        <svg viewBox="0 0 56 40"><rect x="19" y="2" width="18" height="36" rx="4"/><path d="M25 33h6"/></svg>
        <b>Phone</b><span>On-screen keyboard</span>
      </button>
    </div>
  </section>

  <section id="game" class="hidden">
    <div class="stats">
      <div class="stat"><small>Time</small><strong id="t">30</strong></div>
      <div class="stat"><small>WPM</small><strong id="w">0</strong></div>
      <div class="stat"><small>Accuracy</small><strong id="a">100%</strong></div>
    </div>
    <div class="bar" style="margin:14px 0"><i id="bar"></i></div>
    <div id="box"><div id="text"></div></div>
    <input id="kb" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Type here">
    <p id="hint" style="margin:14px 0 0"></p>
    <div class="row" style="justify-content:center"><button class="btn alt" id="change">Change device</button></div>
  </section>

  <section id="end" class="result hidden">
    <div class="big"><span id="rw">0</span> WPM</div>
    <p id="rm"></p>
    <div class="row"><button class="btn" id="again">Play again</button><button class="btn alt" id="change2">Change device</button></div>
  </section>
</main>

<script>
(function(){
  var WORDS="the of and to in is you that it he was for on are as with his they at be this from have or by one had not but what all were when we there can an your which their said if do will each about how up out them then she many some so these would other into has more her two like him see time could no make than first been its who now people my made over did down only way find use may water long little very after words called just where most know get through back much before go good new write our used me man too any day same right look think also around another came come work three word must because does part even place well such here take why things help put years different away again off went old number great tell men say small every found still between name should home big give air line set own under read last never us left end along while might next sound below saw something thought both few those always looked show large often together asked house don't world going want school important until form food keep children feet land side without boy once animals life enough took sometimes four head above kind began almost live page got earth need far hand high year mother light country father let night picture being study second soon story since white ever paper hard near sentence better best across during today however sure knew try told young sun thing whole hear example heard several change answer room sea against top turned learn point city play toward five using himself usually".split(" ");
  var $=function(i){return document.getElementById(i)};
  var DUR=30, platform=null, target="", typed="", started=false, done=false, startT=0, timer=null, errors=0, strokes=0;
  var kb=$("kb"), box=$("box"), textEl=$("text");

  function genWords(n){var o=[];for(var i=0;i<n;i++)o.push(WORDS[Math.floor(Math.random()*WORDS.length)]);return o.join(" ")}
  function render(){
    var h="";
    for(var i=0;i<target.length;i++){
      var c=target[i]==="<"?"&lt;":target[i], cls="";
      if(i<typed.length) cls=typed[i]===target[i]?"ok":"bad";
      else if(i===typed.length) cls="cur";
      h+='<span class="'+cls+'">'+(c===" "&&cls==="bad"?"&nbsp;":c)+"</span>";
    }
    textEl.innerHTML=h;
    var cur=textEl.children[typed.length];
    if(cur){var off=cur.offsetTop-box.clientHeight/3;box.scrollTop=Math.max(0,off)}
  }
  function stats(){
    var el=started?(Date.now()-startT)/60000:0, good=0;
    for(var i=0;i<typed.length;i++) if(typed[i]===target[i]) good++;
    var wpm=el>0?Math.round(good/5/el):0;
    var acc=strokes?Math.round((strokes-errors)/strokes*100):100;
    return {wpm:wpm,acc:acc}
  }
  function tick(){
    var left=Math.max(0,DUR-(Date.now()-startT)/1000);
    $("t").textContent=Math.ceil(left);
    $("bar").style.width=(left/DUR*100)+"%";
    var s=stats();$("w").textContent=s.wpm;$("a").textContent=s.acc+"%";
    if(left<=0) finish();
  }
  function finish(){
    done=true;clearInterval(timer);kb.blur();
    var s=stats();
    $("rw").textContent=s.wpm;
    $("rm").textContent="Accuracy "+s.acc+"% · "+typed.length+" characters typed"+(s.wpm>=60?". Fast hands!":s.wpm>=35?". Solid pace.":". Keep practising.");
    $("game").classList.add("hidden");$("end").classList.remove("hidden");
    $("sub").textContent="Time’s up.";
  }
  function reset(){
    clearInterval(timer);
    target=genWords(120);typed="";started=false;done=false;errors=0;strokes=0;kb.value="";
    $("t").textContent=DUR;$("w").textContent=0;$("a").textContent="100%";$("bar").style.width="100%";
    box.scrollTop=0;render();
  }
  function startGame(){
    $("pick").classList.add("hidden");$("end").classList.add("hidden");$("game").classList.remove("hidden");
    $("sub").textContent=platform==="phone"?"Tap the text box, then type.":"Click the text box or just press any key.";
    $("hint").textContent=platform==="phone"?"Tap the box to open your keyboard. The timer starts on your first letter.":"Start typing. The timer starts on your first key.";
    reset();
    setTimeout(function(){kb.focus()},50);
  }
  function showPick(){
    clearInterval(timer);kb.blur();
    $("game").classList.add("hidden");$("end").classList.add("hidden");$("pick").classList.remove("hidden");
    $("sub").textContent="Pick your device, then start typing.";
  }
  document.querySelectorAll(".choice").forEach(function(b){
    b.addEventListener("click",function(){platform=b.dataset.p;startGame()});
  });
  $("change").onclick=$("change2").onclick=showPick;
  $("again").onclick=startGame;

  box.addEventListener("pointerdown",function(e){e.preventDefault();if(!done)kb.focus()});
  kb.addEventListener("focus",function(){box.classList.add("focus")});
  kb.addEventListener("blur",function(){box.classList.remove("focus")});
  document.addEventListener("keydown",function(e){
    if(platform==="laptop"&&!done&&!$("game").classList.contains("hidden")&&document.activeElement!==kb&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&e.key.length===1){kb.focus()}
  });
  kb.addEventListener("input",function(){
    if(done)return;
    var v=kb.value;
    if(!started&&v.length){started=true;startT=Date.now();$("hint").textContent="";timer=setInterval(tick,100)}
    if(v.length>typed.length){
      for(var i=typed.length;i<v.length;i++){strokes++;if(v[i]!==target[i])errors++}
    }
    typed=v;
    if(typed.length>target.length-30) target+=" "+genWords(60);
    render();
  });
  window.addEventListener("keydown",function(e){if(e.key==="Escape"&&!done&&started){finish()}});
})();
</script>
</body>
</html>
